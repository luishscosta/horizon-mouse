name: Release
# Publishes a release after every merge to main that warrants one: the version comes from the commit messages
# (feat: minor, fix:/perf: patch, ! or BREAKING CHANGE major; docs, ci, chore... publish nothing). A version raised by hand in
# Resources/Info.plist and not released yet is published as it is.
# Needs the repository secrets HORIZON_SIGN_CERT_P12 (base64 .p12 of the signing certificate) and
# HORIZON_SIGN_CERT_PASSWORD. TAP_DEPLOY_KEY (a write deploy key of luishscosta/homebrew-tap) is optional: with it the Homebrew tap is updated too.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if ! gh release view "v$plist" >/dev/null 2>&1; then
            version=$plist   # raised by hand and not released yet
          else
            last=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName' | sed 's/^v//')
            version=$(git log "v$last..HEAD" --no-merges --format=%B | bash scripts/next-version.sh "$last")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "Nothing to release."; echo "new=false" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        if: steps.version.outputs.new == 'true'
        run: bash scripts/test.sh

      - name: Set the version for this build
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          if [ "$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)" != "$version" ]; then
            build=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Resources/Info.plist)
            /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $version" -c "Set CFBundleVersion $((build + 1))" Resources/Info.plist
          fi

      - name: Import signing certificate
        if: steps.version.outputs.new == 'true'
        env:
          P12: ${{ secrets.HORIZON_SIGN_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.HORIZON_SIGN_CERT_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::Secret HORIZON_SIGN_CERT_P12 is missing: an ad-hoc signed release would make every user grant Accessibility again."; exit 1; }
          keychain="$RUNNER_TEMP/sign.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          bash scripts/build.sh
          codesign -dvv "${TMPDIR:-/tmp}/horizonmouse-local-build/Horizon Mouse.app" 2>&1 | grep -q "Authority=Mac Mouse Desk Self-Signed" \
            || { echo "::error::The app was not signed with the release certificate."; exit 1; }

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$version" dist/HorizonMouse.dmg dist/HorizonMouse.zip dist/SHA256SUMS.txt \
            --title "Horizon Mouse $version" "${notes[@]}" --target "$GITHUB_SHA"

      - name: Update Homebrew tap
        if: steps.version.outputs.new == 'true' && env.TAP_KEY != ''
        run: |
          version=${{ steps.version.outputs.version }}
          sha=$(awk '/HorizonMouse.zip/ {print $1}' dist/SHA256SUMS.txt)
          printf "%s\n" "$TAP_KEY" > "$RUNNER_TEMP/tap_key" && chmod 600 "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:luishscosta/homebrew-tap.git tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/horizon-mouse.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "horizon-mouse $version"
          git push
